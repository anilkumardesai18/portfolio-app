name: CI - Build and Lint

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      
      # Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      # Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Run linter
      - name: Run ESLint
        run: npm run lint
      
      # Build the project
      - name: Build Next.js project
        run: npm run build
      
      # Upload build artifacts
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ matrix.node-version }}
          path: .next
          retention-days: 1
      
      # Notify on failure
      - name: Notify on failure
        if: failure()
        run: echo "Build failed for Node.js ${{ matrix.node-version }}"

  # Optional: Add type checking with TypeScript
  type-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # TypeScript will be checked during build
      - name: Verify TypeScript compilation
        run: npm run build
